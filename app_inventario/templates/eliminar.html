<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Producto</title>
</head>
<body>
    <div class="card">
        <h1> Confirmar eliminación</h1>
        <p>¿Estás seguro de que quieres eliminar <strong>"{{ producto.nombre }}"</strong>?</p>
        <p>Esta acción no se puede deshacer.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-eliminar"> Sí, eliminar</button>
            <a href="{% url 'inicio' %}" class="btn btn-cancelar">Cancelar</a>
        </form>
    </div>
</body>
</html>
