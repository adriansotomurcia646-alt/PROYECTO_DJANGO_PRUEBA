<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
</head>
<body>
    <h1> Inventario de Productos</h1>

    <a href="{% url 'crear' %}" class="btn btn-crear">+ Crear Nuevo Producto</a>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in productos %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td><strong>{{ producto.nombre }}</strong></td>
                <td>{{ producto.descripcion }}</td>
                <td>${{ producto.precio }}</td>
                <td>
                    <a href="{% url 'editar' producto.id %}" class="btn btn-editar"> Editar</a>
                    <a href="{% url 'eliminar' producto.id %}" class="btn btn-eliminar"> Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="vacio">No hay productos registrados todavía.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
